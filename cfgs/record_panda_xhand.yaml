teleop:
  type: metareader

dataset:
  repo_id: steb6/test_xhand_tactile
  root: outputs/test_xhand_tactile
  single_task: Move
  fps: 10
  episode_time_s: 2000
  reset_time_s: 0
  num_episodes: 10
  video: true
  push_to_hub: true
  private: false
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  rename_map: {}

teleop_action_processor:
  steps: [clutch_processor, arm_absolute_to_delta, hand_absolute_to_delta]

robot_action_processor:
  steps: []

robot_observation_processor:
  steps: []

display_data: true
play_sounds: true
resume: false
